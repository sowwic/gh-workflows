name: Set up uv project
description: Install optional apt packages, uv, Python, and sync the project dependencies.

inputs:
  python-version:
    description: Python version to use. Empty means read it from python-version-file.
    required: false
    default: ""
  python-version-file:
    description: File to read the Python version from when python-version is empty.
    required: false
    default: pyproject.toml
  apt-packages:
    description: Space-separated apt packages to install (Linux only).
    required: false
    default: ""
  sync-args:
    description: Arguments passed to `uv sync`.
    required: false
    default: --locked --all-extras --dev

runs:
  using: composite
  steps:
    - name: Install system packages (Linux)
      if: runner.os == 'Linux' && inputs.apt-packages != ''
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        python-version-file: ${{ inputs.python-version == '' && inputs.python-version-file || '' }}

    - name: Install the project
      shell: bash
      run: uv sync ${{ inputs.sync-args }}
